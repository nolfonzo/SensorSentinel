services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sensorsentinel
      POSTGRES_USER: sensorsentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensorsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  nocodb:
    container_name: nocodb
    image: nocodb/nocodb:0.301.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NC_DB: "pg://postgres:5432?u=sensorsentinel&p=${DB_PASSWORD}&d=nocodb_meta"
    volumes:
      - ./nocodb/data:/usr/app/data
    ports:
      - "8090:8080"                   # NocoDB web UI

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"                   # MQTT
      - "9001:9001"                   # WebSockets

  nocodb-init:
    container_name: nocodb-init
    image: alpine:3.19
    restart: "no"
    depends_on:
      - nocodb
    environment:
      NOCODB_ADMIN_EMAIL: ${NOCODB_ADMIN_EMAIL}
      NOCODB_ADMIN_PASSWORD: ${NOCODB_ADMIN_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "apk add --no-cache curl jq postgresql15-client > /dev/null 2>&1 && sh /init.sh"
    volumes:
      - ./nocodb-init/init.sh:/init.sh:ro

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./grafana/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"                   # Grafana web UI
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

  nodered:
    container_name: nodered
    image: nodered/node-red:latest
    restart: unless-stopped
    depends_on:
      - mosquitto
      - postgres
    volumes:
      - ./nodered/data:/data
    ports:
      - "1880:1880"                   # Node-RED web UI
      - "1700:1700/udp"               # Semtech packet-forwarder uplink
    environment:
      TZ: Australia/Sydney
      DB_PASSWORD: ${DB_PASSWORD}
      NOTIFY_EMAIL_USER: ${NOTIFY_EMAIL_USER}
      NOTIFY_EMAIL_PASS: ${NOTIFY_EMAIL_PASS}

  # Nightly backup of the two databases and the Node-RED flows, pushed straight
  # off this Pi to the LXD, where restic versions it onto the WD Elements.
  #
  # It backs up nocodb_meta as well as sensorsentinel: NocoDB keeps every view
  # and dashboard in postgres, so a data-only backup restores the numbers and
  # loses the interface built on them.
  backup:
    image: postgres:16-alpine
    container_name: ss-backup
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      # From docker/.env, same as postgres itself. Never inline a default:
      # this repository is public.
      PGPASSWORD: ${DB_PASSWORD}
      PGHOST: postgres
      PGUSER: sensorsentinel
      REMOTE: nolfonzo@100.107.31.26
      REMOTE_DIR: /home/nolfonzo/backups/sensorsentinel
      AT_HOUR: "02"
      KEEP_LOCAL: "7"
      RUN_NOW: "${RUN_NOW:-0}"
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/data:/backups
      - ./nodered/data:/nodered-data:ro
      # The Pi's own key, so it can push to the LXD without a password.
      - /home/nolfonzo/.ssh/id_ed25519:/keys/id_ed25519:ro
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        apk add --no-cache openssh-client >/dev/null 2>&1
        # The key is mounted read-only, so it cannot be chmod'd in place - and
        # ssh refuses a key with loose permissions. Copy it somewhere writable.
        mkdir -p /root/.ssh && cp /keys/id_ed25519 /root/.ssh/id_ed25519
        chmod 600 /root/.ssh/id_ed25519
        exec sh /backup.sh
