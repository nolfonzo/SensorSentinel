# Jetty uplink relay.
#
# The Heltec gateway has no TLS at all, so it publishes here across the local
# network only, and this broker carries the traffic home inside Tailscale. The
# plaintext hop never crosses the internet.
#
# Do NOT set persistence/persistence_location here: Debian's stock
# mosquitto.conf already defines them and a second definition is fatal, not an
# override.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd

connection pi5-uplink
address __UPLINK_HOST__:1883

# Explicit client id. Mosquitto derives one from the hostname by default, so
# two relays would collide if they ever shared a hostname - and colliding MQTT
# client ids make each peer disconnect the other, forever, in a loop that looks
# exactly like a flapping network. Naming it per site removes the guesswork.
clientid __CLIENTID__

# "out" only. The far end cannot publish into this broker, so a compromise at
# the jetty cannot inject into home topics.
topic GWID/# out 0
topic lora/# out 0

cleansession false
bridge_attempt_unsubscribe false
restart_timeout 30
